<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="桃園停車場查詢 — 輸入地點即可找到附近停車場與即時車位資訊" />
  <title>🅿️ 桃園停車場查詢</title>

  <!-- Leaflet CSS (CDN) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🅿️ 桃園停車場查詢</h1>
  </header>

  <main class="app-main">
    <!-- 搜尋區 -->
    <section class="search-section" aria-label="搜尋區">
      <form id="search-form" class="search-form" autocomplete="off">
        <div class="search-input-row">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="輸入地點名稱，例如：南崁兒童藝術村"
            aria-label="輸入地點名稱"
            required
          />
          <button type="submit" class="btn btn-primary" id="search-btn" aria-label="搜尋">
            🔍 搜尋
          </button>
        </div>
        <button type="button" class="btn btn-secondary btn-geo" id="geo-btn" aria-label="使用我目前的位置">
          📍 使用我目前的位置
        </button>
      </form>
    </section>

    <!-- 訊息區（loading / error） -->
    <section id="message-area" class="message-area" aria-live="polite"></section>

    <!-- 地圖 -->
    <section class="map-section" aria-label="地圖">
      <div id="map" class="map"></div>
    </section>

    <!-- 結果區 -->
    <section class="results-section" id="results-section" hidden>
      <div class="results-header">
        <h2 id="results-title">附近停車場</h2>
        <div class="results-controls">
          <label class="checkbox-label">
            <input type="checkbox" id="filter-available" />
            只顯示有車位的
          </label>
          <label class="select-label">
            排序：
            <select id="sort-select" aria-label="排序方式">
              <option value="distance">距離</option>
              <option value="surplus">剩餘車位</option>
            </select>
          </label>
        </div>
      </div>
      <ul id="parking-list" class="parking-list"></ul>
    </section>
  </main>

  <footer class="app-footer">
    <p>
      資料來源：<a href="https://data.tycg.gov.tw/" target="_blank" rel="noopener">桃園市政府開放資料平台</a>
      ・地圖：<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
      ・地名搜尋：<a href="https://nominatim.org/" target="_blank" rel="noopener">Nominatim</a>
    </p>
  </footer>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- App scripts -->
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
