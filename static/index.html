<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>書頁 OCR — 批次文字擷取</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header span { font-size: 1.5rem; }

    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed #c7c7cc;
      border-radius: 16px;
      background: #fff;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #drop-zone.drag-over {
      border-color: #0071e3;
      background: #f0f6ff;
    }
    #drop-zone .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    #drop-zone p { color: #6e6e73; font-size: 0.95rem; margin-top: 0.4rem; }
    #drop-zone strong { color: #0071e3; }

    #file-input { display: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      border-radius: 980px;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #0071e3; color: #fff; }
    .btn-primary:not(:disabled):hover { background: #0077ed; }
    .btn-secondary { background: #e5e5ea; color: #1d1d1f; }
    .btn-secondary:not(:disabled):hover { background: #d8d8dc; }
    .btn-danger { background: #ff3b30; color: #fff; }

    /* Preview grid */
    #preview-section { display: none; }
    #preview-section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #3a3a3c;
    }

    #preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }

    .preview-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      position: relative;
      cursor: grab;
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .preview-card:active { cursor: grabbing; }
    .preview-card.dragging {
      opacity: 0.5;
      transform: scale(0.97);
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
    }
    .preview-card.drag-target { outline: 2px solid #0071e3; }

    .preview-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
    }
    .preview-card .card-footer {
      padding: 0.35rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preview-card .page-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #3a3a3c;
    }
    .preview-card .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      color: #8e8e93;
      padding: 0 2px;
    }
    .preview-card .remove-btn:hover { color: #ff3b30; }

    /* Actions row */
    #actions {
      display: none;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    #page-count {
      margin-left: auto;
      font-size: 0.85rem;
      color: #6e6e73;
    }

    /* Progress */
    #progress-section { display: none; }
    #progress-bar-wrap {
      background: #e5e5ea;
      border-radius: 980px;
      height: 8px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: #0071e3;
      border-radius: 980px;
      width: 0%;
      transition: width 0.3s;
    }
    #progress-label {
      font-size: 0.85rem;
      color: #6e6e73;
      margin-top: 0.5rem;
    }

    /* Results */
    #results-section { display: none; }
    #results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    #results-header h2 { font-size: 1rem; font-weight: 600; color: #3a3a3c; }

    .result-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .result-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #f2f2f7;
      background: #fafafa;
    }
    .result-card-header .title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #3a3a3c;
    }
    .result-card-header .copy-btn {
      font-size: 0.8rem;
      padding: 0.3rem 0.75rem;
    }
    .result-card-body { padding: 1rem; }
    .result-card-body pre {
      font-family: inherit;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #1d1d1f;
    }
    .result-card.error .result-card-body pre {
      color: #ff3b30;
    }
    .token-info {
      font-size: 0.75rem;
      color: #aeaeb2;
      margin-top: 0.5rem;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1d1d1f;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 980px;
      font-size: 0.875rem;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<header>
  <span>📚</span>
  <h1>書頁 OCR — 批次文字擷取</h1>
</header>

<main>

  <!-- Drop zone -->
  <div id="drop-zone">
    <div class="icon">🖼️</div>
    <p><strong>點擊選取</strong>或直接拖曳書頁照片到此處</p>
    <p>支援 JPEG、PNG、WebP・每張上限 20MB・最多 50 張</p>
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/gif,image/webp" multiple />
  </div>

  <!-- Preview -->
  <section id="preview-section">
    <h2>已選圖片（可拖曳調整頁序）</h2>
    <div id="preview-grid"></div>
  </section>

  <!-- Action buttons -->
  <div id="actions">
    <button class="btn btn-primary" id="extract-btn" onclick="startExtract()">
      ✨ 開始擷取文字
    </button>
    <button class="btn btn-secondary" onclick="addMore()">＋ 新增圖片</button>
    <button class="btn btn-danger" onclick="clearAll()">✕ 清除全部</button>
    <span id="page-count"></span>
  </div>

  <!-- Progress -->
  <section id="progress-section">
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="progress-label">準備中…</div>
  </section>

  <!-- Results -->
  <section id="results-section">
    <div id="results-header">
      <h2 id="results-title">擷取結果</h2>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="copyAll()">📋 複製全部文字</button>
        <button class="btn btn-secondary" onclick="downloadTxt()">⬇ 下載 .txt</button>
        <button class="btn btn-secondary" onclick="clearResults()">↩ 重新上傳</button>
      </div>
    </div>
    <div id="results-list"></div>
  </section>

</main>

<div id="toast"></div>

<script>
  let files = [];   // ordered list of File objects
  let dragSrcIdx = null;

  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const previewSec = document.getElementById('preview-section');
  const previewGrid = document.getElementById('preview-grid');
  const actions    = document.getElementById('actions');
  const pageCount  = document.getElementById('page-count');
  const extractBtn = document.getElementById('extract-btn');
  const progressSec = document.getElementById('progress-section');
  const progressBar = document.getElementById('progress-bar');
  const progressLbl = document.getElementById('progress-label');
  const resultsSec  = document.getElementById('results-section');
  const resultsList = document.getElementById('results-list');
  const resultsTitle = document.getElementById('results-title');

  // ---------- Drop zone ----------
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => addFiles(Array.from(e.target.files)));

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
  });

  function addMore() { fileInput.click(); }

  function addFiles(newFiles) {
    const allowed = ['image/jpeg','image/png','image/gif','image/webp','image/jpg'];
    const valid = newFiles.filter(f => allowed.includes(f.type));
    if (valid.length < newFiles.length) showToast('已略過不支援的格式');
    files = [...files, ...valid].slice(0, 50);
    renderPreviews();
  }

  function renderPreviews() {
    previewGrid.innerHTML = '';
    files.forEach((file, idx) => {
      const url = URL.createObjectURL(file);
      const card = document.createElement('div');
      card.className = 'preview-card';
      card.draggable = true;
      card.dataset.idx = idx;

      card.innerHTML = `
        <img src="${url}" alt="page ${idx+1}" loading="lazy" />
        <div class="card-footer">
          <span class="page-label">第 ${idx+1} 頁</span>
          <button class="remove-btn" title="移除" data-idx="${idx}">✕</button>
        </div>`;

      card.addEventListener('dragstart', e => {
        dragSrcIdx = idx;
        setTimeout(() => card.classList.add('dragging'), 0);
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('drag-target'); });
      card.addEventListener('dragleave', () => card.classList.remove('drag-target'));
      card.addEventListener('drop', e => {
        e.preventDefault();
        card.classList.remove('drag-target');
        if (dragSrcIdx !== null && dragSrcIdx !== idx) {
          const moved = files.splice(dragSrcIdx, 1)[0];
          files.splice(idx, 0, moved);
          renderPreviews();
        }
      });

      card.querySelector('.remove-btn').addEventListener('click', e => {
        e.stopPropagation();
        files.splice(+e.target.dataset.idx, 1);
        renderPreviews();
      });

      previewGrid.appendChild(card);
    });

    const hasFiles = files.length > 0;
    previewSec.style.display = hasFiles ? '' : 'none';
    actions.style.display    = hasFiles ? 'flex' : 'none';
    pageCount.textContent    = `共 ${files.length} 張`;
    fileInput.value = '';
  }

  function clearAll() {
    files = [];
    renderPreviews();
    resultsSec.style.display = 'none';
  }

  // ---------- Extract ----------
  async function startExtract() {
    if (files.length === 0) return;

    extractBtn.disabled = true;
    progressSec.style.display = '';
    resultsSec.style.display = 'none';
    resultsList.innerHTML = '';

    const total = files.length;
    const results = [];

    // Send in batches of 5 to avoid overwhelming the server
    const BATCH = 5;
    let done = 0;

    for (let start = 0; start < total; start += BATCH) {
      const batch = files.slice(start, start + BATCH);
      const form = new FormData();
      batch.forEach(f => form.append('files', f));

      updateProgress(done, total, `正在處理第 ${done+1}–${Math.min(done+batch.length, total)} 頁…`);

      try {
        const resp = await fetch('/api/extract', { method: 'POST', body: form });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: resp.statusText }));
          throw new Error(err.detail || resp.statusText);
        }
        const data = await resp.json();
        // Re-number pages according to original order
        data.results.forEach((r, i) => {
          r.page = start + i + 1;
          results.push(r);
        });
      } catch (err) {
        batch.forEach((f, i) => results.push({
          filename: f.name,
          page: start + i + 1,
          success: false,
          error: err.message,
        }));
      }

      done += batch.length;
      updateProgress(done, total, done < total ? `已完成 ${done} / ${total} 頁` : '完成！');
    }

    showResults(results);
    extractBtn.disabled = false;
  }

  function updateProgress(done, total, label) {
    progressBar.style.width = (done / total * 100) + '%';
    progressLbl.textContent = label;
  }

  // ---------- Results ----------
  function showResults(results) {
    progressSec.style.display = 'none';
    resultsSec.style.display = '';

    const ok = results.filter(r => r.success).length;
    resultsTitle.textContent = `擷取結果（${ok} / ${results.length} 頁成功）`;

    resultsList.innerHTML = '';
    results.forEach(r => {
      const card = document.createElement('div');
      card.className = 'result-card' + (r.success ? '' : ' error');

      const header = `
        <div class="result-card-header">
          <span class="title">第 ${r.page} 頁　<span style="font-weight:400;color:#8e8e93">${escHtml(r.filename)}</span></span>
          ${r.success ? `<button class="btn btn-secondary copy-btn" onclick="copyCard(this)">複製</button>` : ''}
        </div>`;

      const body = r.success
        ? `<div class="result-card-body">
             <pre id="page-text-${r.page}">${escHtml(r.text)}</pre>
             ${r.usage ? `<div class="token-info">輸入 ${r.usage.input_tokens} / 輸出 ${r.usage.output_tokens} tokens</div>` : ''}
           </div>`
        : `<div class="result-card-body"><pre>${escHtml(r.error)}</pre></div>`;

      card.innerHTML = header + body;
      resultsList.appendChild(card);
    });
  }

  function copyCard(btn) {
    const pre = btn.closest('.result-card').querySelector('pre');
    navigator.clipboard.writeText(pre.textContent).then(() => showToast('已複製！'));
  }

  function copyAll() {
    const allText = getAllText();
    if (!allText) return showToast('沒有可複製的文字');
    navigator.clipboard.writeText(allText).then(() => showToast('已複製全部文字！'));
  }

  function downloadTxt() {
    const allText = getAllText();
    if (!allText) return showToast('沒有可下載的文字');
    const blob = new Blob([allText], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'book-ocr-' + new Date().toISOString().slice(0,10) + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }

  function getAllText() {
    const pres = resultsList.querySelectorAll('.result-card:not(.error) pre');
    return Array.from(pres).map(p => p.textContent.trim()).filter(Boolean).join('\n\n---\n\n');
  }

  function clearResults() {
    resultsSec.style.display = 'none';
    clearAll();
  }

  // ---------- Toast ----------
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function escHtml(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
